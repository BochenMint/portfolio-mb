    <meta name="theme-color" content="#050506" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('mb-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#eef0f3' : '#050506');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!--
      Only the display face is preloaded. A <canvas> is not an eligible LCP
      element, so the hero's WebGL torus never is the measured paint — the
      headline text is, and this is the file that paints it. The Latin-Extended
      cut carries the Polish diacritics, so Polish copy needs both.
    -->
    <link
      rel="preload"
      href="/fonts/BricolageGrotesque-latin-wght.woff2"
